name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The app itself has no dependencies; pytest is only needed to run the tests.
      - run: pip install pytest
      - run: python -m pytest -q
